apis:
- aid: firebolt:firebolt-rest-api
  name: Firebolt REST API
  humanURL: https://docs.firebolt.io/guides/run-queries/using-the-api
  baseURL: https://api.app.firebolt.io
  tags:
  - SQL
  - Query
  - Engine Management
  description: >-
    The Firebolt REST API issues SQL queries against running engines and manages account, engine, and
    database resources. Authentication is OAuth 2.0 client_credentials against `https://id.app.firebolt.io/oauth/token`
    with audience `https://api.firebolt.io`, using a service account ID and secret. Tokens are sent as
    `Authorization: Bearer <access_token>`.
