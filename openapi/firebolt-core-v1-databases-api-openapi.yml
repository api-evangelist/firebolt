            This field is not needed anymore and will be removed in the future.'
          $ref: '#/components/schemas/firebolt.core.v1.EngineRevisionID'
        endpoint_serving_revision_id:
          description: 'Output only. Revision that is currently served by the endpoint.


            This field will only be set when field "current_status" is set to "ENGINE_STATUS_RUNNING_REVISION_SERVING" or

            "ENGINE_STATUS_RUNNING_REVISION_CHANGING".'
