    firebolt.core.v1.EngineStatus:
      description: "EngineStatus lists possible statuses of an Engine.\n\n - ENGINE_STATUS_CREATED: Logical record is created, however underlying infrastructure is not initialized.\nIn other words this means that engine is stopped.\n - ENGINE_STATUS_PROVISIONING_PENDING: Engine initialization request was sent.\n - ENGINE_STATUS_PROVISIONING_STARTED: Engine initialization request was received and initialization process started.\n - ENGINE_STATUS_PROVISIONING_FINISHED: Engine initialization was finished successfully.\n - ENGINE_STATUS_PROVISIONING_FAILED: Engine initialization failed due to error.\n - ENGINE_STATUS_RUNNING_IDLE: Engine is initialized, but there are no running or starting engine revisions.\n - ENGINE_STATUS_RUNNING_REVISION_STARTING: Engine is initialized, there are no running engine revision but it's starting.\n - ENGINE_STATUS_RUNNING_REVISION_STARTUP_FAILED: Engine is initialized, initial revision is failed to provision or start.\n - ENGINE_STATUS_RUNNING_REVISION_SERVING: Engine is ready (serves an engine revision).\n - ENGINE_STATUS_RUNNING_REVISION_CHANGING: Engine is ready (serves an engine revision), zero-downtime replacement revision is starting.\n - ENGINE_STATUS_RUNNING_REVISION_CHANGE_FAILED: Engine is ready (serves an engine revision), replacement revision failed to provision or start.\n - ENGINE_STATUS_RUNNING_REVISION_RESTARTING: Engine is initialized, replacement of the revision with a downtime is in progress.\n - ENGINE_STATUS_RUNNING_REVISION_RESTART_FAILED: Engine is initialized, replacement revision failed to provision or start.s\n - ENGINE_STATUS_RUNNING_REVISIONS_TERMINATING: Engine is initialized, all child revisions are being terminated.\n - ENGINE_STATUS_TERMINATION_PENDING: Engine termination request was sent.\n - ENGINE_STATUS_TERMINATION_STARTED: Engine termination started.\n - ENGINE_STATUS_TERMINATION_FINISHED: Engine termination finished.\n - ENGINE_STATUS_TERMINATION_FAILED: Engine termination failed.\n - ENGINE_STATUS_DELETED: Engine is soft-deleted."
      type: string
      default: ENGINE_STATUS_UNSPECIFIED
      enum:
      - ENGINE_STATUS_UNSPECIFIED
      - ENGINE_STATUS_CREATED
      - ENGINE_STATUS_PROVISIONING_PENDING
      - ENGINE_STATUS_PROVISIONING_STARTED
      - ENGINE_STATUS_PROVISIONING_FINISHED
      - ENGINE_STATUS_PROVISIONING_FAILED
      - ENGINE_STATUS_RUNNING_IDLE
      - ENGINE_STATUS_RUNNING_REVISION_STARTING
      - ENGINE_STATUS_RUNNING_REVISION_STARTUP_FAILED
      - ENGINE_STATUS_RUNNING_REVISION_SERVING
      - ENGINE_STATUS_RUNNING_REVISION_CHANGING
      - ENGINE_STATUS_RUNNING_REVISION_CHANGE_FAILED
      - ENGINE_STATUS_RUNNING_REVISION_RESTARTING
      - ENGINE_STATUS_RUNNING_REVISION_RESTART_FAILED
      - ENGINE_STATUS_RUNNING_REVISIONS_TERMINATING
      - ENGINE_STATUS_TERMINATION_PENDING
      - ENGINE_STATUS_TERMINATION_STARTED
      - ENGINE_STATUS_TERMINATION_FINISHED
      - ENGINE_STATUS_TERMINATION_FAILED
      - ENGINE_STATUS_DELETED
