          $ref: '#/components/schemas/firebolt.core.v1.EngineStatus'
          readOnly: true
        current_status_summary:
          description: Output only. Shorter, human-friendly current status of this engine.
          $ref: '#/components/schemas/firebolt.core.v1.EngineStatusSummary'
          readOnly: true
        description:
          description: 'User-friendly description of the purpose of this engine.


            Length: 0-255.'
