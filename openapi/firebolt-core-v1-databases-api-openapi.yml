    firebolt.core.v1.Engine:
      description: 'Engine represents a virtual Firebolt DB cluster that will serve requests.


        To understand what Engine is, think of traditional Nodes and Load Balancers.

        Engine is like a Load Balancer that routes traffic to different Nodes (Engine Revisions) based on their health.


        When we need to upgrade an engine (change version, instance types, reboot, etc), we start a new Engine Revision,

        wait for it to start up and become ready, tell Engine to route requests to this Engine Revision and tell the old one

        to terminate.'
      type: object
      properties:
        compute_region_id:
          description: 'Required. ID of the compute region to use for this engine.


            Immutable.'
          $ref: '#/components/schemas/firebolt.compute.v1.RegionID'
