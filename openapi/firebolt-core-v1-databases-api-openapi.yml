openapi: 3.2.0
info:
  title: Firebolt Core.v1.databases API
  version: 1.0.0
  x-logo:
    altText: Firebolt
    backgroundColor: '#FFFFFF'
    url: https://assets.website-files.com/5e8a264ceaf4870394477fc7/5e8a264ceaf4879f75477fdd_logo_website.svg
tags:
- name: core.v1.databases
  x-displayName: Databases
paths:
  /core/v1/account/databases:
    get:
      tags:
      - core.v1.databases
      summary: Returns a list of available databases
      operationId: coreV1ListDatabases
      parameters:
      - description: Sorting specification.
        name: order_by
        in: query
        schema:
          type: string
          enum:
          - DATABASE_ORDER_UNSPECIFIED
          - DATABASE_ORDER_NAME_ASC
          - DATABASE_ORDER_NAME_DESC
          - DATABASE_ORDER_COMPUTE_REGION_ID_ASC
          - DATABASE_ORDER_COMPUTE_REGION_ID_DESC
          - DATABASE_ORDER_DATA_SIZE_FULL_ASC
          - DATABASE_ORDER_DATA_SIZE_FULL_DESC
          - DATABASE_ORDER_DATA_SIZE_COMPRESSED_ASC
          - DATABASE_ORDER_DATA_SIZE_COMPRESSED_DESC
          - DATABASE_ORDER_CREATE_TIME_ASC
          - DATABASE_ORDER_CREATE_TIME_DESC
          - DATABASE_ORDER_CREATE_ACTOR_ASC
          - DATABASE_ORDER_CREATE_ACTOR_DESC
          - DATABASE_ORDER_LAST_UPDATE_TIME_ASC
          - DATABASE_ORDER_LAST_UPDATE_TIME_DESC
          - DATABASE_ORDER_LAST_UPDATE_ACTOR_ASC
          - DATABASE_ORDER_LAST_UPDATE_ACTOR_DESC
          default: DATABASE_ORDER_UNSPECIFIED
      - description: 'The `first` parameter indicates the number of results that the client would like to see in the response when

          `after` is set or neither `after` or `before` is set.


          Default: 25.'
        name: page.first
        in: query
        schema:
          type: integer
          format: int32
      - description: 'When `after` is provided, the returned paginated data will have as its first item the item that is

          immediately after the cursor in the results list. (An exception is that, if there are no items in the results list

          that fall after the cursor, the returned paginated data will be an empty array.).'
        name: page.after
        in: query
        schema:
          type: string
      - description: 'The `last` parameter indicates the number of results that the client would like to see in the response

          when `before` is set.


          Default: 25.'
        name: page.last
        in: query
        schema:
          type: integer
          format: int32
      - description: 'When `before` is provided, the last item returned in the paginated data will be the item that is closest to,

          but still before, the cursor in the unpaginated results list. (Analogous to the above, if there are no items in the

          results list that fall before the cursor, the returned paginated data will be an empty array.).'
        name: page.before
        in: query
        schema:
          type: string
      - description: Value should be equal.
        name: filter.id_database_id_eq
        in: query
        schema:
          type: string
      - description: Value should contain the given string.
        name: filter.name_contains
        in: query
        schema:
          type: string
      - description: Value should be equal.
        name: filter.is_system_database_eq
        in: query
        schema:
          type: boolean
          format: boolean
      - description: Value should be equal.
        name: filter.create_actor_eq
        in: query
        schema:
          type: string
      - description: Value should be equal.
        name: filter.attached_engine_name_eq
        in: query
        schema:
          type: string
      - description: Value should contain.
        name: filter.attached_engine_name_contains
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/firebolt.core.v1.ListDatabasesResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
    post:
      tags:
      - core.v1.databases
      summary: Creates a new database
      operationId: coreV1CreateDatabase
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/firebolt.core.v1.CreateDatabaseResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/firebolt.core.v1.CreateDatabaseRequest'
        required: true
  /core/v1/account/databases/{database_id}:
    get:
      tags:
      - core.v1.databases
      summary: Retrieves database by it's ID
      operationId: coreV1GetDatabase
      parameters:
      - description: Required. ID of the database.
        name: database_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/firebolt.core.v1.GetDatabaseResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
    delete:
      tags:
      - core.v1.databases
      summary: Deletes database by it's ID
      operationId: coreV1DeleteDatabase
      parameters:
      - description: Optional. Flag to disable deletion of all bound engines.
        name: disable_bound_engines_removing
        in: query
        schema:
          type: boolean
          format: boolean
      - description: Required. ID of the database.
        name: database_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/firebolt.core.v1.DeleteDatabaseResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
    patch:
      tags:
      - core.v1.databases
      summary: Updates database by it's ID
      operationId: coreV1UpdateDatabase
      parameters:
      - description: Required. ID of the database.
        name: database_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/firebolt.core.v1.UpdateDatabaseResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/firebolt.core.v1.UpdateDatabaseRequest'
        required: true
  /core/v1/account/databases:getIdByName:
    get:
      tags:
      - core.v1.databases
      summary: Retrieves database ID by account ID and database name
      operationId: coreV1GetDatabaseIdByName
      parameters:
      - description: Required. ID of the database.
        name: database_name
        in: query
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/firebolt.core.v1.GetDatabaseIdByNameResponse'
        default:
          description: An unexpected error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
components:
  schemas:
    grpc.gateway.runtime.Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
        error:
          type: string
        message:
          type: string
    firebolt.core.v1.EngineSettingsWarmUp:
      description: "EngineSettingsWarmUp represents possible values for engine warm up.\n\n - ENGINE_SETTINGS_WARM_UP_MINIMAL: On-demand loading (both indexes and tables data).\n - ENGINE_SETTINGS_WARM_UP_INDEXES: Load indexes only.\n - ENGINE_SETTINGS_WARM_UP_ALL: Full data auto-loading (both indexes and table data - full warmup).\n - ENGINE_SETTINGS_WARM_UP_SHARD_ON_READ: Prepares all nodes to access all data, rather than assigning statically a range per node.\nNodes will select dynamically what data to load."
      type: string
      default: ENGINE_SETTINGS_WARM_UP_UNSPECIFIED
      enum:
      - ENGINE_SETTINGS_WARM_UP_UNSPECIFIED
      - ENGINE_SETTINGS_WARM_UP_MINIMAL
      - ENGINE_SETTINGS_WARM_UP_INDEXES
      - ENGINE_SETTINGS_WARM_UP_ALL
      - ENGINE_SETTINGS_WARM_UP_SHARD_ON_READ
    firebolt.core.v1.EngineSettingsLoggingLevel:
      description: EngineSettingsLoggingLevel represents possible values for engine logging level.
      type: string
      default: ENGINE_SETTINGS_LOGGING_LEVEL_UNSPECIFIED
      enum:
      - ENGINE_SETTINGS_LOGGING_LEVEL_UNSPECIFIED
      - ENGINE_SETTINGS_LOGGING_LEVEL_TRACE
      - ENGINE_SETTINGS_LOGGING_LEVEL_DEBUG
      - ENGINE_SETTINGS_LOGGING_LEVEL_INFO
      - ENGINE_SETTINGS_LOGGING_LEVEL_WARNING
      - ENGINE_SETTINGS_LOGGING_LEVEL_ERROR
    firebolt.core.v1.BindingHealthStatus:
      description: BindingHealthStatus lists possible statuses of an binding health.
      type: string
      default: BINDING_HEALTH_STATUS_UNSPECIFIED
      enum:
      - BINDING_HEALTH_STATUS_UNSPECIFIED
      - BINDING_HEALTH_STATUS_HEALTHY
      - BINDING_HEALTH_STATUS_DEGRADED
      - BINDING_HEALTH_STATUS_UNHEALTHY
    firebolt.core.v1.EngineID:
      description: EngineID represents unique identifier of the record.
      type: object
      properties:
        account_id:
          description: Required. ID of the account this record belongs to.
          type: string
        engine_id:
          description: Required. Unique record ID.
          type: string
    firebolt.core.v1.DatabaseEdge:
      description: DatabaseEdge represents a single record in paginated list.
      type: object
      properties:
        cursor:
          description: Pagination cursor for this node.
          type: string
        node:
          description: Node instance.
          $ref: '#/components/schemas/firebolt.core.v1.Database'
    firebolt.core.v1.EngineStatusSummary:
      description: "EngineStatusSummary lists possible statuses of an Engine.\n\n - ENGINE_STATUS_SUMMARY_STOPPED: Fully stopped.\n - ENGINE_STATUS_SUMMARY_STARTING: Provisioning process is in progress.\nWe are creating cloud infra for this engine.\n - ENGINE_STATUS_SUMMARY_STARTING_INITIALIZING: Provisioning process is complete.\nWe are now waiting for PackDB cluster to initialize and start.\n - ENGINE_STATUS_SUMMARY_RUNNING: Fully started.\nEngine is ready to serve requests.\n - ENGINE_STATUS_SUMMARY_UPGRADING: Version of the PackDB is changing.\nThis is zero downtime operation that does not affect engine work.s\nThis status is reserved for future use (not used fow now).\n - ENGINE_STATUS_SUMMARY_RESTARTING: Hard restart (full stop/start cycle) is in progress.\nUnderlying infrastructure is being recreated.\n - ENGINE_STATUS_SUMMARY_RESTARTING_INITIALIZING: Hard restart (full stop/start cycle) is in progress.\nUnderlying infrastructure is ready, waiting for PackDB cluster to initialize and start.\nThis status is logically the same as ENGINE_STATUS_SUMMARY_STARTING_INITIALIZING,\nbut used during restart cycle.\n - ENGINE_STATUS_SUMMARY_REPAIRING: Underlying infrastructure has issues and is being repaired.\nEngine is still running, but it's not fully healthy and some queries may fail.\n - ENGINE_STATUS_SUMMARY_STOPPING: Stop is in progress.\n - ENGINE_STATUS_SUMMARY_DELETING: Termination is in progress.\nAll infrastructure that belongs to this engine will be completely destroyed.\n - ENGINE_STATUS_SUMMARY_DELETED: Infrastructure is terminated, engine data is deleted.\n - ENGINE_STATUS_SUMMARY_FAILED: Failed to start or stop.\nThis status only indicates that there were issues during provisioning operations.\nIf engine enters this status, all infrastructure should be stopped/terminated already."
      type: string
      default: ENGINE_STATUS_SUMMARY_UNSPECIFIED
      enum:
      - ENGINE_STATUS_SUMMARY_UNSPECIFIED
      - ENGINE_STATUS_SUMMARY_STOPPED
      - ENGINE_STATUS_SUMMARY_STARTING
      - ENGINE_STATUS_SUMMARY_STARTING_INITIALIZING
      - ENGINE_STATUS_SUMMARY_RUNNING
      - ENGINE_STATUS_SUMMARY_UPGRADING
      - ENGINE_STATUS_SUMMARY_RESTARTING
      - ENGINE_STATUS_SUMMARY_RESTARTING_INITIALIZING
      - ENGINE_STATUS_SUMMARY_REPAIRING
      - ENGINE_STATUS_SUMMARY_STOPPING
      - ENGINE_STATUS_SUMMARY_DELETING
      - ENGINE_STATUS_SUMMARY_DELETED
      - ENGINE_STATUS_SUMMARY_FAILED
    firebolt.core.v1.UpdateDatabaseResponse:
      type: object
      properties:
        database:
          description: Updated record.
          $ref: '#/components/schemas/firebolt.core.v1.Database'
    firebolt.core.v1.DeleteDatabaseResponse:
      type: object
      properties:
        database:
          description: Updated record.
          $ref: '#/components/schemas/firebolt.core.v1.Database'
    firebolt.core.v1.DatabaseStatus:
      description: DatabaseStatus is a list of possible database statuses.
      type: string
      default: DATABASE_STATUS_UNSPECIFIED
      enum:
      - DATABASE_STATUS_UNSPECIFIED
      - DATABASE_STATUS_CREATED
      - DATABASE_STATUS_PROVISIONING_PENDING
      - DATABASE_STATUS_PROVISIONING_STARTED
      - DATABASE_STATUS_PROVISIONING_FINISHED
      - DATABASE_STATUS_PROVISIONING_FAILED
      - DATABASE_STATUS_RUNNING
      - DATABASE_STATUS_TERMINATION_PENDING
      - DATABASE_STATUS_TERMINATION_STARTED
      - DATABASE_STATUS_TERMINATION_FINISHED
      - DATABASE_STATUS_TERMINATION_FAILED
      - DATABASE_STATUS_DELETED
    firebolt.core.v1.EngineRevisionHealthStatus:
      description: EngineRevisionHealthStatus lists possible statuses of an engine revision health.
      type: string
      default: ENGINE_REVISION_HEALTH_STATUS_UNSPECIFIED
      enum:
      - ENGINE_REVISION_HEALTH_STATUS_UNSPECIFIED
      - ENGINE_REVISION_HEALTH_STATUS_HEALTHY
      - ENGINE_REVISION_HEALTH_STATUS_DEGRADED
      - ENGINE_REVISION_HEALTH_STATUS_UNHEALTHY
    firebolt.core.v1.CreateDatabaseRequest:
      type: object
      properties:
        database:
          description: Record to create.
          $ref: '#/components/schemas/firebolt.core.v1.Database'
        engine_bindings:
          description: Engine binding configuration.
          $ref: '#/components/schemas/firebolt.core.v1.DatabaseToEngineBindings'
    firebolt.core.v1.BindingID:
      description: BindingID represents unique identifier of the record.
      type: object
      properties:
        account_id:
          description: Required. ID of the account this record belongs to.
          type: string
        database_id:
          description: Required. ID of the database to bind.
          type: string
        engine_id:
          description: Required. ID of the engine to bind.
          type: string
    firebolt.core.v1.BindingStatus:
      description: BindingStatus is a list of possible binding statuses.
      type: string
      default: BINDING_STATUS_UNSPECIFIED
      enum:
      - BINDING_STATUS_UNSPECIFIED
      - BINDING_STATUS_CREATED
      - BINDING_STATUS_PROVISIONING_PENDING
      - BINDING_STATUS_PROVISIONING_STARTED
      - BINDING_STATUS_PROVISIONING_FINISHED
      - BINDING_STATUS_PROVISIONING_FAILED
      - BINDING_STATUS_RUNNING
      - BINDING_STATUS_TERMINATION_PENDING
      - BINDING_STATUS_TERMINATION_STARTED
      - BINDING_STATUS_TERMINATION_FINISHED
      - BINDING_STATUS_TERMINATION_FAILED
      - BINDING_STATUS_DELETED
    firebolt.core.v1.GetDatabaseIdByNameResponse:
      type: object
      properties:
        database_id:
          description: Retrieved record.
          $ref: '#/components/schemas/firebolt.core.v1.DatabaseID'
    firebolt.core.v1.CreateDatabaseResponse:
      type: object
      properties:
        bindings:
          description: Affected bindings.
          type: array
          items:
            $ref: '#/components/schemas/firebolt.core.v1.Binding'
        database:
          description: Created database record.
          $ref: '#/components/schemas/firebolt.core.v1.Database'
        engine_revisions:
          description: Affected engine revisions.
          type: array
          items:
            $ref: '#/components/schemas/firebolt.core.v1.EngineRevision'
        engines:
          description: Affected engines.
          type: array
          items:
            $ref: '#/components/schemas/firebolt.core.v1.Engine'
    firebolt.core.v1.EngineSettings:
      description: 'EngineSettings represents configurable engine parameters.


        Parameters in this object can be changed during engine runtime without need of a rolling upgrade or restart.'
      type: object
      properties:
        auto_stop_delay_duration:
          description: 'Amount of time since last query executed by this Engine after which Engine will be automatically stopped.


            Zero value disables this feature.

            Default: 30m'
          type: string
        is_read_only:
          description: Whether this engine is read only.
          type: boolean
          format: boolean
        minimum_logging_level:
          description: 'Minimum level of logs that should be produced.


            Default: ENGINE_SETTINGS_LOGGING_LEVEL_INFO'
          $ref: '#/components/schemas/firebolt.core.v1.EngineSettingsLoggingLevel'
        preset:
          description: EngineSettingsPreset represents settings preset of an engine.
          $ref: '#/components/schemas/firebolt.core.v1.EngineSettingsPreset'
        warm_up:
          description: 'EngineSettingsWarmUp defines which data should be fetched upon engine start.


            Default: ENGINE_SETTINGS_WARM_UP_MINIMAL'
          $ref: '#/components/schemas/firebolt.core.v1.EngineSettingsWarmUp'
    firebolt.core.v1.ListDatabasesResponse:
      type: object
      properties:
        edges:
          description: List of found records.
          type: array
          items:
            $ref: '#/components/schemas/firebolt.core.v1.DatabaseEdge'
        page:
          description: Page descriptor.
          $ref: '#/components/schemas/firebolt.shared.v1.PageDescriptor'
    firebolt.core.v1.EngineRevisionStatus:
      description: "EngineRevisionStatus lists possible provisioning statuses of an engine revision.\n\n - ENGINE_REVISION_STATUS_CREATED: Logical revision is created, but physical cluster is stopped.\n - ENGINE_REVISION_STATUS_PROVISIONING_PENDING: Provisioning request was sent.\n - ENGINE_REVISION_STATUS_PROVISIONING_STARTED: Provisioning started.\n - ENGINE_REVISION_STATUS_PROVISIONING_FINISHED: Provisioning finished.\n - ENGINE_REVISION_STATUS_PROVISIONING_FAILED: Provisioning failed.\n - ENGINE_REVISION_STATUS_FAILED: Cluster is provisioned, but nodes fail to start.\n - ENGINE_REVISION_STATUS_RUNNING: Cluster is provisioned, all nodes are running.\n - ENGINE_REVISION_STATUS_REPAIRING: Cluster is provisioned, some nodes are offline, repair in progress.\n - ENGINE_REVISION_STATUS_TERMINATION_PENDING: Cluster is provisioned, termination request was sent.\n - ENGINE_REVISION_STATUS_TERMINATION_STARTED: Termination started.\n - ENGINE_REVISION_STATUS_TERMINATION_FINISHED: Termination finished.\n - ENGINE_REVISION_STATUS_TERMINATION_FAILED: Termination failed.\n - ENGINE_REVISION_STATUS_DELETED: Revision is soft deleted.\n - ENGINE_REVISION_STATUS_RESTARTING: Deprecated. This status was added here by mistake and was never used.\n - ENGINE_REVISION_STATUS_STARTED: Cluster is provisioned, all nodes started.\n - ENGINE_REVISION_STATUS_LOADING: Cluster is provisioned. All nodes started. Schema loading is in process."
      type: string
      default: ENGINE_REVISION_STATUS_UNSPECIFIED
      enum:
      - ENGINE_REVISION_STATUS_UNSPECIFIED
      - ENGINE_REVISION_STATUS_CREATED
      - ENGINE_REVISION_STATUS_PROVISIONING_PENDING
      - ENGINE_REVISION_STATUS_PROVISIONING_STARTED
      - ENGINE_REVISION_STATUS_PROVISIONING_FINISHED
      - ENGINE_REVISION_STATUS_PROVISIONING_FAILED
      - ENGINE_REVISION_STATUS_FAILED
      - ENGINE_REVISION_STATUS_RUNNING
      - ENGINE_REVISION_STATUS_REPAIRING
      - ENGINE_REVISION_STATUS_TERMINATION_PENDING
      - ENGINE_REVISION_STATUS_TERMINATION_STARTED
      - ENGINE_REVISION_STATUS_TERMINATION_FINISHED
      - ENGINE_REVISION_STATUS_TERMINATION_FAILED
      - ENGINE_REVISION_STATUS_DELETED
      - ENGINE_REVISION_STATUS_RESTARTING
      - ENGINE_REVISION_STATUS_STARTED
      - ENGINE_REVISION_STATUS_LOADING
    firebolt.core.v1.EngineRevisionSpecification:
      description: EngineRevisionSpecification represents parameters that should be used for engine revision.
      type: object
      properties:
        db_compute_instances_count:
          description: 'Required. Number of DB instance nodes to create.


            Range: 1-128.'
          type: integer
          format: int64
          maximum: 128
          minimum: 1
        db_compute_instances_type_id:
          description: Required. ID of the compute instance type to use for this engine DB instance nodes.
          $ref: '#/components/schemas/firebolt.compute.v1.InstanceTypeID'
        db_compute_instances_use_spot:
          description: Required. Whether to use spot instances for DB instance nodes.
          type: boolean
          format: boolean
        db_version:
          description: 'Version of the FireboltDB to use for this engine.


            By default, latest stable version will be used.


            Users with "XXX" permission are able to specify any valid SemVer version or Git commit hash.

            TODO: Correct permission name.'
          type: string
        proxy_instances_count:
          description: 'Required. Number of Proxy instance nodes to create.


            Range: 1-128.'
          type: integer
          format: int64
          maximum: 64
          minimum: 1
        proxy_instances_type_id:
          description: Required. ID of the compute instance type to use for this engine Proxy instance nodes.
          $ref: '#/components/schemas/firebolt.compute.v1.InstanceTypeID'
        proxy_version:
          description: 'Version of the Firebolt Proxy to use for this engine.


            By default, latest stable version will be used.


            Users with "XXX" permission are able to specify any valid SemVer version or Git commit hash.

            TODO: Correct permission name.'
          type: string
    firebolt.core.v1.UpdateDatabaseRequest:
      type: object
      properties:
        database:
          description: Data to update.
          $ref: '#/components/schemas/firebolt.core.v1.Database'
        database_id:
          description: Required. ID of the database.
          type: string
        engine_bindings:
          description: 'Engine binding configuration.

            If this field is set, existing bindings will be replaced with new ones.'
          $ref: '#/components/schemas/firebolt.core.v1.DatabaseToEngineBindings'
        update_mask:
          description: The update mask applies to the resource.
          $ref: '#/components/schemas/google.protobuf.FieldMask'
    firebolt.core.v1.EngineSettingsPreset:
      description: EngineSettingsPreset represents settings preset of an engine.
      type: string
      default: ENGINE_SETTINGS_PRESET_UNSPECIFIED
      enum:
      - ENGINE_SETTINGS_PRESET_UNSPECIFIED
      - ENGINE_SETTINGS_PRESET_GENERAL_PURPOSE
      - ENGINE_SETTINGS_PRESET_DATA_ANALYTICS
    firebolt.shared.v1.PageDescriptor:
      description: PageDescriptor represents pagination information in collection response.
      type: object
      properties:
        has_next_page:
          description: Whether next page is available.
          type: boolean
          format: boolean
        has_previous_page:
          description: Whether previous page is available.
          type: boolean
          format: boolean
        page_size:
          description: Number of items returned at this page.
          type: integer
          format: int64
        total_size:
          description: Total number of items matching the query.
          type: integer
          format: int64
    firebolt.core.v1.DatabaseToEngineBindings:
      description: DatabaseToEngineBindings represents desired configuration of bindings of the database.
      type: object
      properties:
        existing:
          description: Bind to existing engines.
          $ref: '#/components/schemas/firebolt.core.v1.DatabaseToEngineBindings.Existing'
        new:
          description: Create new engine(s) and bind database to them.
          $ref: '#/components/schemas/firebolt.core.v1.DatabaseToEngineBindings.New'
    google.protobuf.FieldMask:
      description: "paths: \"f.a\"\n    paths: \"f.b.d\"\n\nHere `f` represents a field in some root message, `a` and `b`\nfields in the message found in `f`, and `d` a field found in the\nmessage in `f.b`.\n\nField masks are used to specify a subset of fields that should be\nreturned by a get operation or modified by an update operation.\nField masks also have a custom JSON encoding (see below).\n\n# Field Masks in Projections\n\nWhen used in the context of a projection, a response message or\nsub-message is filtered by the API to only contain those fields as\nspecified in the mask. For example, if the mask in the previous\nexample is applied to a response message as follows:\n\n    f {\n      a : 22\n      b {\n        d : 1\n        x : 2\n      }\n      y : 13\n    }\n    z: 8\n\nThe result will not contain specific values for fields x,y and z\n(their value will be set to the default, and omitted in proto text\noutput):\n\n\n    f {\n      a : 22\n      b {\n        d : 1\n      }\n    }\n\nA repeated field is not allowed except at the last position of a\npaths string.\n\nIf a FieldMask object is not present in a get operation, the\noperation applies to all fields (as if a FieldMask of all fields\nhad been specified).\n\nNote that a field mask does not necessarily apply to the\ntop-level response message. In case of a REST get operation, the\nfield mask applies directly to the response, but in case of a REST\nlist operation, the mask instead applies to each individual message\nin the returned resource list. In case of a REST custom method,\nother definitions may be used. Where the mask applies will be\nclearly documented together with its declaration in the API.  In\nany case, the effect on the returned resource/resources is required\nbehavior for APIs.\n\n# Field Masks in Update Operations\n\nA field mask in update operations specifies which fields of the\ntargeted resource are going to be updated. The API is required\nto only change the values of the fields as specified in the mask\nand leave the others untouched. If a resource is passed in to\ndescribe the updated values, the API ignores the values of all\nfields not covered by the mask.\n\nIf a repeated field is specified for an update operation, new values will\nbe appended to the existing repeated field in the target resource. Note that\na repeated field is only allowed in the last position of a `paths` string.\n\nIf a sub-message is specified in the last position of the field mask for an\nupdate operation, then new value will be merged into the existing sub-message\nin the target resource.\n\nFor example, given the target message:\n\n    f {\n      b {\n        d: 1\n        x: 2\n      }\n      c: [1]\n    }\n\nAnd an update message:\n\n    f {\n      b {\n        d: 10\n      }\n      c: [2]\n    }\n\nthen if the field mask is:\n\n paths: [\"f.b\", \"f.c\"]\n\nthen the result will be:\n\n    f {\n      b {\n        d: 10\n        x: 2\n      }\n      c: [1, 2]\n    }\n\nAn implementation may provide options to override this default behavior for\nrepeated and message fields.\n\nIn order to reset a field's value to the default, the field must\nbe in the mask and set to the default value in the provided resource.\nHence, in order to reset all fields of a resource, provide a default\ninstance of the resource and set all fields in the mask, or do\nnot provide a mask as described below.\n\nIf a field mask is not present on update, the operation applies to\nall fields (as if a field mask of all fields has been specified).\nNote that in the presence of schema evolution, this may mean that\nfields the client does not know and has therefore not filled into\nthe request will be reset to their default. If this is unwanted\nbehavior, a specific service may require a client to always specify\na field mask, producing an error if not.\n\nAs with get operations, the location of the resource which\ndescribes the updated values in the request message depends on the\noperation kind. In any case, the effect of the field mask is\nrequired to be honored by the API.\n\n## Considerations for HTTP REST\n\nThe HTTP kind of an update operation which uses a field mask must\nbe set to PATCH instead of PUT in order to satisfy HTTP semantics\n(PUT must only be used for full updates).\n\n# JSON Encoding of Field Masks\n\nIn JSON, a field mask is encoded as a single string where paths are\nseparated by a comma. Fields name in each path are converted\nto/from lower-camel naming conventions.\n\nAs an example, consider the following message declarations:\n\n    message Profile {\n      User user = 1;\n      Photo photo = 2;\n    }\n    message User {\n      string display_name = 1;\n      string address = 2;\n    }\n\nIn proto a field mask for `Profile` may look as such:\n\n    mask {\n      paths: \"user.display_name\"\n      paths: \"photo\"\n    }\n\nIn JSON, the same mask is represented as below:\n\n    {\n      mask: \"user.displayName,photo\"\n    }\n\n# Field Masks and Oneof Fields\n\nField masks treat fields in oneofs just as regular fields. Consider the\nfollowing message:\n\n    message SampleMessage {\n      oneof test_oneof {\n        string name = 4;\n        SubMessage sub_message = 9;\n      }\n    }\n\nThe field mask can be:\n\n    mask {\n      paths: \"name\"\n    }\n\nOr:\n\n    mask {\n      paths: \"sub_message\"\n    }\n\nNote that oneof type names (\"test_oneof\" in this case) cannot be used in\npaths.\n\n## Field Mask Verification\n\nThe implementation of any API method which has a FieldMask type field in the\nrequest should verify the included field paths, and return an\n`INVALID_ARGUMENT` error if any path is unmappable."
      type: object
      title: '`FieldMask` represents a set of symbolic field paths, for example:'
      properties:
        paths:
          description: The set of field mask paths.
          type: array
          items:
            type: string
